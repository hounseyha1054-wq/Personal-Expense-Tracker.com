name: personal_expense_tracker
description: "A production Personal Expense Tracker with Flutter, Firebase Authentication, Express.js and MongoDB."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  google_sign_in: ^6.2.2
  dio: ^5.8.0+1
  get_storage: ^2.1.1
  fl_chart: ^0.70.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  firebase_messaging: ^15.2.10
  in_app_update: ^5.0.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
